<div class="video-uploader-container">
  <div class="add-button mb-4">
    <p-button 
      icon="pi pi-plus" 
      (click)="addVideo()"
      [label]="languageService.isAr() ? 'إضافة فيديو' : 'Add Video'"
      styleClass="p-button-outlined">
    </p-button>
  </div>

  <div class="video-cards-container">
    @for (ctrl of videos.controls; let i = $index; track i) {
      <div class="video-card border-2 rounded-md">
        <div class="video-preview">
          @if (ctrl.value) {
            <video 
              [src]="ctrl.value" 
              controls 
              class="w-full h-full rounded-md">
            </video>
          } @else {
            <div class="empty-preview">
              <i class="pi pi-video" style="font-size: 2rem"></i>
              <span>{{ languageService.isAr() ? 'لا يوجد فيديو' : 'No Video' }}</span>
            </div>
          }
        </div>
        
        <div class="card-footer">
          <input 
            type="file" 
            accept="video/*" 
            #fileInput 
            (change)="onFileSelected($event, i)" 
            class="file-input" />
          
          <div class="flex gap-2">
            <p-button 
              icon="pi pi-upload" 
              (click)="fileInput.click()"
              [label]="languageService.isAr() ? 'رفع' : 'Upload'"
              styleClass="p-button-outlined p-button-sm flex-1">
            </p-button>

            <p-button 
              icon="pi pi-trash" 
              (click)="removeVideo(i)"
              styleClass="p-button-outlined p-button-danger p-button-sm"
              [pTooltip]="languageService.isAr() ? 'حذف' : 'Delete'" 
              tooltipPosition="top">
            </p-button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
