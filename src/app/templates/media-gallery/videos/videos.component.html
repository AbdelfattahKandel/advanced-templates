<div class="grid grid-cols-12 gap-6 w-3/4 mx-auto">
    <!-- Block 1: Basic Video Gallery -->
    <div class="col-span-12 md:col-span-6">
      <p-card header="{{ isAr() ? 'المعرض الأساسي للفيديو' : 'Basic Video Gallery' }}">
        <p-galleria [value]="videos" [responsiveOptions]="responsiveOptions" [numVisible]="3">
          <ng-template #item let-video>
            <video controls width="100%">
              <source [src]="video.videoSrc" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
          </ng-template>
          <ng-template #thumbnail let-video>
            <img [src]="video.thumbnailImageSrc" [alt]="video.alt" />
          </ng-template>
        </p-galleria>
      </p-card>
    </div>
  
    <!-- Block 2: With Prev/Next -->
    <div class="col-span-12 md:col-span-6">
      <p-card header="{{ isAr() ? 'المعرض مع أزرار التنقل' : 'Gallery with Navigation' }}">
        <div class="mb-4 flex gap-2">
          <p-button type="button" icon="pi pi-minus" (click)="prev()" />
          <p-button type="button" icon="pi pi-plus" severity="secondary" (click)="next()" />
        </div>
        <p-galleria [value]="videos" [numVisible]="3" [responsiveOptions]="responsiveOptions" [activeIndex]="activeIndex">
          <ng-template #item let-video>
            <video controls width="100%">
              <source [src]="video.videoSrc" type="video/mp4" />
            </video>
          </ng-template>
          <ng-template #thumbnail let-video>
            <img [src]="video.thumbnailImageSrc" [alt]="video.alt" />
          </ng-template>
        </p-galleria>
      </p-card>
    </div>
  </div>
