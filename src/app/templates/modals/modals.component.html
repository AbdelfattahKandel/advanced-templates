<div class="grid grid-cols-12 gap-4 w-3/4 mx-auto">

    <!-- Buttons to trigger modals -->
    <div class="col-span-12 flex flex-wrap gap-2 mb-4">
      <p-button label="View Data" (click)="displayView = true"></p-button>
      <p-button label="Edit Data" (click)="displayEdit = true"></p-button>
      <p-button label="Confirm Action" (click)="displayConfirm = true" severity="warn"></p-button>
      <p-button label="Alert" (click)="displayAlert = true" severity="danger"></p-button>
      <p-button label="Form Modal" (click)="displayForm = true" severity="success"></p-button>
    </div>
  
    <!-- Modal 1: View Data with Table and Images -->
    <p-dialog header="View Data" [(visible)]="displayView" [modal]="true" [closable]="true" [style]="{ width: '600px' }">
      <p-table [value]="users">
        <ng-template pTemplate="header">
          <tr>
            <th>Avatar</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
          <tr>
            <td><img [src]="user.avatar" width="50" style="border-radius:50%;" /></td>
            <td>{{user.name}}</td>
            <td>{{user.email}}</td>
            <td>{{user.role}}</td>
            <td><p-button icon="pi pi-eye" (click)="selectUser(user)" tooltip="View"></p-button></td>
          </tr>
        </ng-template>
      </p-table>
      <p-footer>
        <p-button label="Close" (click)="displayView=false"></p-button>
      </p-footer>
    </p-dialog>
  
    <!-- Modal 2: Edit Data Form -->
    <p-dialog header="Edit Data" [(visible)]="displayEdit" [modal]="true" [closable]="true" [style]="{ width: '400px' }">
      <div class="flex flex-col gap-2">
        <label>Name</label>
        <input pInputText [(ngModel)]="editedData.name" />
        <label>Email</label>
        <input pInputText [(ngModel)]="editedData.email" />
        <label>Role</label>
        <input pInputText [(ngModel)]="editedData.role" />
      </div>
      <p-footer>
        <p-button label="Save" (click)="saveEdit()" severity="success"></p-button>
        <p-button label="Cancel" (click)="displayEdit=false" class="ml-2"></p-button>
      </p-footer>
    </p-dialog>
  
    <!-- Modal 3: Confirm Action -->
    <p-dialog header="Confirm" [(visible)]="displayConfirm" [modal]="true" [closable]="false" [style]="{ width: '400px' }">
      <p>Are you sure you want to proceed?</p>
      <p-footer>
        <p-button label="Yes" (click)="confirmAction()" severity="success"></p-button>
        <p-button label="No" (click)="displayConfirm=false" class="ml-2" severity="danger"></p-button>
      </p-footer>
    </p-dialog>
  
    <!-- Modal 4: Alert -->
    <p-dialog header="Alert" [(visible)]="displayAlert" [modal]="true" [closable]="true" [style]="{ width: '400px' }">
      <p>This is an alert message!</p>
      <p-footer>
        <p-button label="Close" (click)="displayAlert=false" severity="danger"></p-button>
      </p-footer>
    </p-dialog>
  
    <!-- Modal 5: Form Modal -->
    <p-dialog header="Form Modal" [(visible)]="displayForm" [modal]="true" [closable]="true" [style]="{ width: '400px' }">
      <form class="flex flex-col gap-2">
        <label>Name</label>
        <input pInputText [(ngModel)]="editedData.name" name="name" />
        <label>Email</label>
        <input pInputText [(ngModel)]="editedData.email" name="email" />
        <label>Role</label>
        <input pInputText [(ngModel)]="editedData.role" name="role" />
      </form>
      <p-footer>
        <p-button label="Submit" (click)="saveEdit()" severity="success"></p-button>
        <p-button label="Cancel" (click)="displayForm=false" class="ml-2"></p-button>
      </p-footer>
    </p-dialog>
  
  </div>
